name: Build and Deploy to ECR

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-uri: ${{ steps.digest.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-ECR-Push

      - name: Login to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          registry-type: public

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.ECR_REGISTRY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=registry

      - name: Get image digest
        id: digest
        run: |
          echo "digest=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT
          echo "image=${{ env.ECR_REGISTRY }}@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

      - name: Output image information
        run: |
          echo "Image pushed successfully!"
          echo "Registry: ${{ env.ECR_REGISTRY }}"
          echo "Digest: ${{ steps.digest.outputs.digest }}"
          echo "Full image URI: ${{ steps.digest.outputs.image }}"

  deploy-to-eodh:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.ref_name }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Deploy CWL to EODH
        run: |
          # Read the CWL file and replace the Docker image placeholder
          sed "s|tif2cog:latest|${{ needs.build-and-push.outputs.image-uri }}|g" tiff_to_cog.cwl > tiff_to_cog-deployed.cwl

          echo "Deploying to EODH API..."
          echo "Docker image: ${{ needs.build-and-push.outputs.image-uri }}"

          # Deploy to EODH API and capture response
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            -H "Content-Type: application/cwl+yaml" \
            -H "Authorization: Bearer ${{ secrets.EODH_TOKEN }}" \
            --data-binary @tiff_to_cog-deployed.cwl \
            "https://eodatahub.org.uk/api/catalogue/stac/catalogs/user/catalogs/${{ vars.EODH_WORKSPACE }}/processes/tiff_to_cog")

          # Split response body and status code
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body:"
          echo "$RESPONSE_BODY"

          # Check if deployment was successful (expecting 204 for successful PUT)
          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Successfully deployed CWL workflow to EODH!"
          else
            echo "❌ Deployment failed with HTTP status: $HTTP_CODE"
            echo "Expected status code: 204"
            exit 1
          fi
